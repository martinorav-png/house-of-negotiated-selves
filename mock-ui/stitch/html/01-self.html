                01 SELF
            </div>

                    Describe your current state of being.
                </h1>

                    <textarea class="w-full h-64 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-6 font-body-lg text-body-lg text-on-surface resize-none soft-shadow transition-all duration-300 placeholder:text-outline/50" placeholder="I feel..."></textarea>
                    <!-- Soft ambient glow behind textarea -->
                    <div class="absolute -inset-4 ambient-glow -z-10 opacity-0 group-focus-within:opacity-100 transition-opacity duration-700"></div>
                </div>

                <!-- Choice Chips -->
                <div class="flex flex-wrap gap-4 mb-16">
                    <button class="px-6 py-3 rounded-full bg-secondary-fixed text-on-secondary-container font-label-sm text-label-sm border border-secondary-fixed hover:bg-secondary-fixed-dim transition-colors">Harmonious</button>
                    <button class="px-6 py-3 rounded-full bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm border border-outline-variant hover:border-primary-container transition-colors">Restless</button>
                    <button class="px-6 py-3 rounded-full bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm border border-outline-variant hover:border-primary-container transition-colors">Seeking</button>
                    <button class="px-6 py-3 rounded-full bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm border border-outline-variant hover:border-primary-container transition-colors">Numb</button>
                    <button class="px-6 py-3 rounded-full bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm border border-outline-variant hover:border-primary-container transition-colors">Overwhelmed</button>
                </div>

            </div>

            <!-- Right Column: ID Ringlight Panel -->
            <div class="w-full md:w-[40%] flex justify-center items-center mt-12 md:mt-0 md:pl-12 border-t md:border-t-0 md:border-l border-surface-variant/50 pt-12 md:pt-0 relative">

                    <!-- Ringlight Effect -->
                    <div class="absolute inset-0 rounded-full border-4 border-surface-container-highest group-hover:border-primary-fixed transition-colors duration-700"></div>
                    <div class="absolute inset-2 rounded-full border border-outline-variant/30"></div>
                    
                    <!-- Camera Placeholder / Live Reflection Area -->
                    <div class="w-[95%] h-[95%] rounded-full overflow-hidden relative bg-inverse-surface">
                        <!-- Abstract placeholder for camera feed -->
                         <div class="absolute inset-0 bg-gradient-to-tr from-inverse-surface to-on-surface-variant opacity-80 mix-blend-overlay"></div>
                         
                         <!-- Crosshair / Reticle -->
                         <div class="absolute inset-0 flex items-center justify-center opacity-30">

                            <div class="w-px h-full bg-surface-container-highest absolute"></div>

</div>
