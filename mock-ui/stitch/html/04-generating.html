<script>
        // Simple script to cycle progress blocks for demo purposes
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.max-w-sm.flex');
            if(container) {
                 const blocks = container.querySelectorAll('div');
                 let currentFill = 5;
                 
                 setInterval(() => {
                     if(currentFill < blocks.length) {
                         blocks[currentFill].classList.remove('bg-surface-dim');
                         blocks[currentFill].classList.add('bg-primary', 'progress-block');
                         blocks[currentFill].style.animationDelay = '0s';
                         currentFill++;
                     } else {
                         // Reset for loop
                         blocks.forEach((b, i) => {
                             b.classList.remove('bg-primary', 'progress-block');
                             b.classList.add('bg-surface-dim');
                         });
                         currentFill = 0;
                     }
                 }, 800);
            }
        });
    </script>
