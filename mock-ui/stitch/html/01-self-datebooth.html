<!DOCTYPE html>

<style>
        body {
            background-color: #0D0D0D;
            overflow: hidden;
            cursor: crosshair;
        }
        .glass-panel {
            background: rgba(19, 19, 19, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(243, 182, 194, 0.1);
        }
        .mirror-void {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0d0d0d 100%);
            z-index: -1;
        }
        .glow-soft {
            box-shadow: 0 0 40px rgba(243, 182, 194, 0.05);
        }
        .ornament-line {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, #f3b6c2 50%, transparent 100%);
            opacity: 0.3;
        }
        .vertical-ornament {
            width: 1px;
            background: linear-gradient(180deg, transparent 0%, #f3b6c2 50%, transparent 100%);
            opacity: 0.2;
        }
        .input-focus-line {
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .floating-vitrine {
            animation: float 12s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 m-0 text-on-surface font-body-lg overflow-hidden">
<div class="mirror-void"></div>
<div class="relative w-full max-w-[450px] aspect-[9/16] overflow-hidden flex flex-col items-center bg-[#0D0D0D] p-margin-edge">
<header class="fixed top-0 w-full z-50 flex flex-col items-center pt-10">
<div class="flex flex-col items-center gap-2 mb-4">
<span class="material-symbols-outlined text-secondary text-[24px] opacity-60" style="font-variation-settings: 'FILL' 0;">favorite</span>
<div class="ornament-line w-32"></div>
</div>
<div class="font-label-caps text-label-caps tracking-[0.4em] text-secondary opacity-80 uppercase">01 SELF</div>
</header>
<main class="relative w-full flex flex-col flex-1 mt-40 z-10">
<section class="flex flex-col gap-12 w-full">
<h1 class="font-headline-md text-headline-md italic text-secondary leading-tight max-w-[80%]">
                    WHAT IS YOUR FULL GOVERNMENT NAME?
                </h1>
<div class="relative w-full group">
<label class="font-label-caps text-label-caps text-outline mb-2 block tracking-widest uppercase" for="gov-name">Government name</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-4 px-0 text-headline-md font-headline-md focus:ring-0 focus:border-secondary transition-colors placeholder:text-outline-variant/40 outline-none" id="gov-name" placeholder="Begin typing..." type="text"/>
<div class="input-focus-line absolute bottom-0 left-0 h-[1px] bg-secondary w-0 group-focus-within:w-full"></div>
</div>
<div class="glass-panel p-gutter flex flex-col gap-4 border-l-2 border-l-secondary/40">
<div class="flex items-center gap-3">
<span class="font-label-caps text-label-caps text-secondary-fixed-dim">DEBRA</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<p class="text-body-lg text-on-surface/70 leading-relaxed font-light italic">
                        "Now, just answer what comes up on the mirror. You can type it out on the keyboard in front of you."
                    </p>
</div>
</section>
<div class="absolute -right-12 top-1/2 -translate-y-1/2 w-64 h-[400px] pointer-events-none opacity-40 floating-vitrine">
<div class="relative w-full h-full glass-panel border border-secondary/20 flex flex-col items-center justify-end overflow-hidden">
<img class="absolute inset-0 w-full h-full object-cover grayscale brightness-75 mix-blend-screen" src="https://lh3.googleusercontent.com/aida/AP1WRLt_z37eHa7CUCaVlMiLAKv07HKPLNuYv4IgVcg3LupUi_hP7NDrtvpvsUdehblP8NsPLElb0vkxl0OlUoxtS6wLokG9lmna5bjIGM6LZ-qm0yqDheNvnU2r7tNki40t5aTDfyKoqwuzFxiXH77fA5CYWG9QMNZ3SmGT8VvF4rvi6SPc2ZCZWhuhwoMfVLaBb0S3SeqESEgl1zdhNSQ4aGfxCPtZyjVdGMhtzs9nnxXjoAM24qyhIA5viNhL"/>
<div class="relative z-10 w-full p-4 bg-surface-container-lowest/80 backdrop-blur-md">
<div class="font-label-caps text-[10px] text-secondary tracking-widest">AVAILABLE TONIGHT</div>
</div>
</div>
</div>
<div class="mt-auto mb-16">
<button class="w-full py-6 border border-secondary group relative overflow-hidden transition-all duration-700 hover:shadow-[0_0_30px_rgba(243,182,194,0.15)] active:scale-95">
<div class="absolute inset-0 bg-secondary/0 group-hover:bg-secondary/10 transition-colors duration-500"></div>
<span class="relative font-label-caps text-label-caps tracking-[0.3em] text-secondary">CONTINUE</span>
</button>
</div>
</main>
<footer class="fixed bottom-10 w-full flex flex-col items-center pointer-events-none">
<div class="flex items-center justify-center gap-12 w-full opacity-30">
<div class="ornament-line flex-1"></div>
<span class="material-symbols-outlined text-[12px] text-secondary">diamond</span>
<div class="ornament-line flex-1"></div>
</div>
</footer>
<div class="fixed left- margin-edge top-1/2 -translate-y-1/2 vertical-ornament h-[40%] pointer-events-none opacity-20"></div>
<div class="fixed right- margin-edge top-1/2 -translate-y-1/2 vertical-ornament h-[40%] pointer-events-none opacity-20"></div>
</div>
<script>
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            document.querySelector('.mirror-void').style.transform = `translate(${x}px, ${y}px)`;
        });

        const input = document.getElementById('gov-name');
        input.addEventListener('input', (e) => {
            if(e.target.value.length > 0) {
                input.style.fontStyle = 'normal';
            } else {
                input.style.fontStyle = 'italic';
            }
        });
    </script>
</body></html>
